name: Publish to npm and MCP Registry

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with MCP Registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Skip when the version is already up. npm's client sometimes retries after a
      # slow response and the retry reports "cannot publish over", failing the step
      # on a publish that actually succeeded — which then blocks the registry step
      # below on every re-run.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "opengraph-io-mcp@$VERSION" version > /dev/null 2>&1; then
            echo "opengraph-io-mcp@$VERSION is already on npm - skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # The registry verifies the version exists on npm, and npm's read path lags its
      # write path by a little. Retry rather than lose a release over seconds.
      - name: Publish to MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Attempt $attempt failed; waiting 30s for npm to catch up"
            sleep 30
          done
          echo "MCP Registry publish failed after 5 attempts"
          exit 1
